name: continue-sme-loop
description: "Apply SME input, re-refine, and review an inspected strategy"

vars:
  sme_user: sme-reviewer
  sme_token: sme-reviewer-token
  strategy_refine_fqn: "github.com/jctanner-opendatahub-io/strat-creator@feature/dashboard-sme-and-loop-metrics:strategy-refine"
  strategy_review_fqn: "github.com/jctanner-opendatahub-io/strat-creator@feature/dashboard-sme-and-loop-metrics:strategy-review"

steps:
  - name: verify_sme_account
    type: jira_api
    params:
      path: "/rest/api/2/user?username={{ sme_user }}"
      method: GET

  - name: populate_sme_input
    description: "Edit the RHAISTRAT description through Jira as the SME"
    type: shell_exec
    params:
      command: |
        set -euo pipefail
        issue="{{ strat_issue }}"
        jira="{{ jira_base }}"
        user="{{ sme_user }}"
        token="{{ sme_token }}"

        python3 - <<'PY'
        import json
        import re
        from pathlib import Path

        sme_input = """SME review entered for the strategy refine-loop integration test.

        The strategy must keep the diagnostic command read-only. Certificate-expiry
        checks should produce actionable warnings, while already-invalid certificates
        must be treated as critical failures. The rhai-cli midstream project is
        opendatahub-io/odh-cli; use that repository as the implementation target."""
        Path("/tmp/strat-sme-comment-request.json").write_text(
            json.dumps({"body": sme_input})
        )
        PY

        curl -sfk -u "{{ sme_user }}:{{ sme_token }}" \
          -H 'Content-Type: application/json' \
          -X POST \
          "$jira/rest/api/2/issue/$issue/comment" \
          --data-binary @/tmp/strat-sme-comment-request.json \
          >/tmp/strat-sme-comment.json
        python3 - <<'PY'
        import json
        from pathlib import Path

        comment = json.loads(Path("/tmp/strat-sme-comment.json").read_text())
        author = comment.get("author", {})
        if author.get("name") != "{{ sme_user }}":
            raise SystemExit(f"comment was not authored by {{ sme_user }}: {author}")
        PY

        curl -sfk -u "$user:$token" \
          "$jira/rest/api/2/issue/$issue?fields=description" \
          >/tmp/strat-before-sme-edit.json
        python3 - <<'PY'
        import json
        import re
        from pathlib import Path

        issue = "{{ strat_issue }}"
        data = json.loads(Path("/tmp/strat-before-sme-edit.json").read_text())
        description = data.get("fields", {}).get("description", "")
        if not isinstance(description, str):
            raise SystemExit("Jira description is not markdown text")
        heading = re.search(
            r"(?m)^(?:##\s*)?Staff Engineer / SME Input\s*$", description
        )
        if not heading:
            raise SystemExit("SME section missing from Jira description")
        start = heading.end()
        next_header = re.search(r"\n## ", description[start:])
        end = start + next_header.start() if next_header else len(description)
        sme = """\n\n<!-- entered by sme-reviewer -->
        SME review entered for the strategy refine-loop integration test.

        The strategy must keep the diagnostic command read-only. Certificate-expiry
        checks should produce actionable warnings, while already-invalid certificates
        must be treated as critical failures. The rhai-cli midstream project is
        opendatahub-io/odh-cli; use that repository as the implementation target.
        """
        updated = description[:start] + sme + description[end:]
        Path("/tmp/strat-sme-description-update.json").write_text(
            json.dumps({"fields": {"description": updated}})
        )
        Path("/tmp/strat-sme-description.md").write_text(updated)
        print(f"Prepared Jira SME edit for {issue}")
        PY

        curl -sfk -u "$user:$token" \
          -H 'Content-Type: application/json' \
          -X PUT \
          "$jira/rest/api/2/issue/$issue" \
          --data-binary @/tmp/strat-sme-description-update.json \
          >/tmp/strat-sme-edit-response.json

        curl -sfk -u "$user:$token" \
          "$jira/rest/api/2/issue/$issue?fields=description" \
        >/tmp/strat-after-sme-edit.json
        python3 - <<'PY'
        import json
        import re
        from pathlib import Path

        expected = Path("/tmp/strat-sme-description.md").read_text()
        actual = json.loads(Path("/tmp/strat-after-sme-edit.json").read_text())
        actual = actual.get("fields", {}).get("description", "")
        if actual != expected:
            raise SystemExit("Jira description did not retain the SME edit")

        print("Jira retained the SME edit; the strategy-refine agent must import it into its local artifact")
        PY

  - name: clear_review_gate_labels
    description: "Re-open the reviewed strategy for the SME-driven refinement"
    type: jira_api
    params:
      path: "/rest/api/2/issue/{{ strat_issue }}"
      method: PUT
      body:
        update:
          labels:
            - remove: strat-creator-rubric-pass
            - remove: strat-creator-needs-attention

  - name: re_refine_strategy
    description: "Re-run strategy-refine against the existing inspected strategy"
    workflow: run-skill
    vars:
      skill_fqn: "{{ strategy_refine_fqn }}"
      skill_issue: "{{ strat_issue }}"
      skill_extra_kwargs: "sme_input_sync=Before_refining_fetch_the_current_RHAISTRAT_description_from_Jira_and_merge_its_Staff_Engineer_SME_Input_section_into_the_local_artifact_preserving_frontmatter_Business_Need_and_all_other_human_authored_content"

  - name: assert_sme_refine_count
    description: "Require the SME-driven productive refine to increment the counter"
    type: shell_exec
    params:
      command: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib
        import json
        import re
        from pathlib import Path

        state = json.loads(Path("/app/artifacts/.integration/strat-sme-loop-initial.json").read_text())
        path = Path(state["path"])
        text = path.read_text()
        count = re.search(r"(?m)^refine_count:\s*(\d+)\s*$", text)
        if not count or int(count.group(1)) != state["refine_count"] + 1:
            raise SystemExit(f"expected refine_count=2 in {path}")
        if "<!-- entered by sme-reviewer -->" not in text:
            raise SystemExit("SME input marker was removed")
        if "Certificate-expiry" not in text:
            raise SystemExit("SME input text was removed")
        business_start = text.index("## Business Need")
        strategy_start = text.index("## Strategy")
        business_hash = hashlib.sha256(text[business_start:strategy_start].encode()).hexdigest()
        if business_hash != state["business_need_sha256"]:
            raise SystemExit("Business Need section was modified during refinement")
        body_hash = hashlib.sha256(text.encode()).hexdigest()
        if body_hash == state["body_sha256"]:
            raise SystemExit("strategy artifact did not change after SME input")
        print(json.dumps({"path": str(path), "refine_count": 2, "status": "passed"}))
        PY

  - name: review_refined_strategy
    description: "Review the SME-refined strategy"
    workflow: run-skill
    vars:
      skill_fqn: "{{ strategy_review_fqn }}"
      skill_issue: "{{ strat_issue }}"
