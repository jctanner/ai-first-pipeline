version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  github_emulator:
    name: github-emulator-readonly
    endpoints:
      - host: github.local
        port: 80
        protocol: rest
        tls: none
        enforcement: enforce
        access: read-only
        allowed_ips:
          - 10.43.0.0/16
    binaries:
      - { path: /usr/bin/curl }
  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: "*.aiplatform.googleapis.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: us-east5-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: "/usr/local/lib/node_modules/@anthropic-ai/claude-code/**" }
  google_auth:
    name: google-auth
    endpoints:
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: "/usr/local/lib/node_modules/@anthropic-ai/claude-code/**" }
