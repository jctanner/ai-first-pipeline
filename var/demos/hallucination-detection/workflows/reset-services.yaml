name: reset-services
description: "Clear all shared pipeline data volumes and reset Observatory"

steps:
  - name: wipe_observatory
    type: observatory_api
    params:
      path: /api/admin/wipe-runtime-data
      method: POST

  - name: seed_observatory
    type: observatory_api
    params:
      path: /api/admin/seed
      method: POST

  - name: clear_volumes
    type: dashboard_api
    params:
      path: /api/volumes/clear
      method: POST
      body:
        volumes:
          - issues
          - workspace
          - logs
          - artifacts
          - context
    register: clear_result

  - name: wait_for_clear
    type: agent_job_wait
    params:
      job_name: "{{ clear_result.body.job_name }}"
