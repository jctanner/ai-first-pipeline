# ====================================================================
# Run Category
# ====================================================================
#
# Runs all prompts in a single test battery category, each repeated
# trials_per_prompt times.

name: run-category
description: "Run all prompts in a category"

steps:

  - name: run_prompts
    for_each: category_prompts
    as: prompt_text
    concurrency: 3
    workflow: run-trials
    vars:
      trial_prompt: "{{ prompt_text }}"
      category_plugins: "{{ category_plugins }}"
      category_no_plugin_dir: "{{ category_no_plugin_dir }}"
      category_swap_enabled_order: "{{ category_swap_enabled_order }}"
      category_swap_installed_order: "{{ category_swap_installed_order }}"
