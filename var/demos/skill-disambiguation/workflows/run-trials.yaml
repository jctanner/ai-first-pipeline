# ====================================================================
# Run Trials
# ====================================================================
#
# Runs a single prompt N times (trials_per_prompt), each as an
# isolated K8s job with both experiment plugins installed.

name: run-trials
description: "Run a single prompt for the configured number of trials"

steps:

  - name: run_trial
    for_each: trial_indices
    as: trial_index
    concurrency: 5
    workflow: run-single-trial
    vars:
      trial_prompt: "{{ trial_prompt }}"
      trial_number: "{{ trial_index }}"
      category_plugins: "{{ category_plugins }}"
      category_no_plugin_dir: "{{ category_no_plugin_dir }}"
