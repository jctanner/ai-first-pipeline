# ====================================================================
# Run Battery
# ====================================================================
#
# Iterates over the test battery categories (defined in vars.yaml) and
# submits jobs for each prompt, repeated trials_per_prompt times.

name: run-battery
description: "Run all test battery prompts with the configured number of trials"

steps:

  - name: run_categories
    for_each: battery
    as: category
    concurrency: 1
    workflow: run-category
    vars:
      category_id: "{{ category.id }}"
      category_prompts: "{{ category.prompts }}"
      category_plugins: "{{ category.plugins }}"
      category_no_plugin_dir: "{{ category.no_plugin_dir | default('') }}"
