# ====================================================================
# Reset Jira
# ====================================================================
#
# Wipes all Jira data, re-seeds default projects, then creates any
# additional projects listed in vars.yaml that aren't part of the
# emulator's built-in seed set.

name: reset-jira
description: "Wipe Jira and seed all projects from vars.yaml"

steps:

  # Step 1: Full reset — drops all tables, re-seeds defaults
  - name: reset_database
    type: jira_api
    params:
      path: /api/admin/reset
      method: POST

  # Step 2: Ensure every project in jira_projects exists
  - name: seed_projects
    for_each: jira_projects
    as: proj
    steps:

      - name: "check_{{ proj.key }}"
        type: jira_api
        params:
          path: "/rest/api/2/project/{{ proj.key }}"
          method: GET
          ignore_status: [404]
        register: project_check

      - name: "create_{{ proj.key }}"
        type: jira_api
        when: "project_check.status_code == 404"
        params:
          path: /api/admin/import
          method: POST
          body:
            issues:
              - key: "{{ proj.key }}-1"
                fields:
                  project:
                    key: "{{ proj.key }}"
                    name: "{{ proj.name }}"
                  issuetype:
                    name: Epic
                  summary: "Bootstrap issue (auto-created by demo setup)"
                  status:
                    name: Open

      - name: "cleanup_stub_{{ proj.key }}"
        type: jira_api
        when: "project_check.status_code == 404"
        params:
          path: "/rest/api/2/issue/{{ proj.key }}-1"
          method: DELETE
          ignore_status: [404]

  # Step 3: Verify all projects exist
  - name: verify_projects
    for_each: jira_projects
    as: proj
    steps:
      - name: "verify_{{ proj.key }}"
        type: jira_api
        params:
          path: "/rest/api/2/project/{{ proj.key }}"
          method: GET
