# Per-issue idempotent claim extraction. A current receipt skips the agent job.

name: run-claim-extraction
description: "Extract claims for {{ claim_issue }} when inputs are stale"

vars:
  force_claims: false
  claims_skill_revision: "unresolved"
  claims_repository_revision: "unresolved"
  claims_skill_execution_repo: "{{ claims_skill_repo }}"
  claims_model: "claude-opus-4-6"
  claims_harness: "claude-code"
  claims_configuration_digest: "unresolved"
  claims_decontextualization_mode: "basic"
  claims_segmentation_version: "claim-segmentation-v1"
  claims_preceding_context_units: 1
  claims_following_context_units: 1
  claims_git_extra_env: "{}"

steps:

  - name: check_receipt
    type: shell_exec
    params:
      command: |
        ISSUE="{{ claim_issue }}" \
        SKILL_FQN="{{ claims_skill_repo }}:extract-claims" \
        SKILL_REVISION="{{ claims_skill_revision }}" \
        MODEL="{{ claims_model }}" \
        HARNESS="{{ claims_harness }}" \
        CONFIGURATION_DIGEST="{{ claims_configuration_digest }}" \
        DECONTEXTUALIZATION_MODE="{{ claims_decontextualization_mode }}" \
        FORCE_CLAIMS="{{ force_claims }}" \
        python3 - <<'PY'
        import hashlib, json, os
        from pathlib import Path

        root = Path('/app/artifacts')
        issue = os.environ['ISSUE'].upper()
        skill_fqn = os.environ['SKILL_FQN']
        skill_revision = os.environ['SKILL_REVISION']
        model = os.environ['MODEL']
        harness = os.environ['HARNESS']
        configuration_digest = os.environ['CONFIGURATION_DIGEST']
        decontextualization_mode = os.environ['DECONTEXTUALIZATION_MODE']
        force = os.environ['FORCE_CLAIMS'].lower() in {'1', 'true', 'yes', 'on'}
        skip_dirs = {'.git', 'claims', 'verification', 'explanations'}

        def included(path):
            rel = path.relative_to(root)
            if issue not in rel.as_posix().upper():
                return False
            if any(p.startswith('.') or p in skip_dirs for p in rel.parts):
                return False
            if ({'rfe-originals', 'strat-originals', 'ci-jobs'}
                    & set(rel.parts)):
                return False
            return '-strat-text.md' not in path.name and path.name not in {
                'README.md', 'strat-rubric.md'}

        inputs = sorted(p for p in root.rglob('*.md') if p.is_file() and included(p))
        digest = hashlib.sha256()
        implementation = {
            'skill_fqn': skill_fqn,
            'skill_revision': skill_revision,
            'model': model,
            'harness': harness,
            'configuration_digest': configuration_digest,
            'decontextualization_mode': decontextualization_mode,
        }
        digest.update(b'claim-receipt-v2\0')
        digest.update(json.dumps(implementation, sort_keys=True).encode())
        digest.update(b'\0')
        for path in inputs:
            digest.update(path.relative_to(root).as_posix().encode())
            digest.update(b'\0')
            digest.update(hashlib.sha256(path.read_bytes()).digest())
        input_digest = f'sha256:{digest.hexdigest()}'
        receipt_path = root / 'claims' / '.receipts' / f'{issue}.json'

        reusable = False
        reason = 'receipt-missing'
        if force:
            reason = 'forced'
        elif receipt_path.is_file():
            try:
                receipt = json.loads(receipt_path.read_text())
            except (OSError, json.JSONDecodeError):
                reason = 'receipt-invalid'
            else:
                checks = [
                    (receipt.get('result') == 'complete', 'receipt-incomplete'),
                    (receipt.get('schema_version') == 2, 'schema-changed'),
                    (receipt.get('stage') == 'extract-claims', 'stage-changed'),
                    (receipt.get('scope') == {'issue': issue}, 'scope-changed'),
                    (receipt.get('implementation') == implementation,
                     'implementation-changed'),
                    (receipt.get('inputs', {}).get('digest') == input_digest,
                     'inputs-changed'),
                    (all((root / path).is_file()
                         for path in receipt.get('outputs', {}).get('artifacts', [])),
                     'outputs-missing'),
                ]
                failure = next((name for ok, name in checks if not ok), None)
                if failure:
                    reason = failure
                else:
                    reusable = True
                    reason = 'receipt-current'

        print(json.dumps({
            'issue': issue,
            'skill_fqn': skill_fqn,
            'implementation': implementation,
            'input_digest': input_digest,
            'input_artifacts': [p.relative_to(root).as_posix() for p in inputs],
            'receipt_path': receipt_path.as_posix(),
            'reusable': reusable,
            'reason': reason,
        }))
        PY
    register: receipt_check

  - name: set_receipt_state
    type: set_fact
    vars:
      receipt: "{{ receipt_check.stdout | fromjson }}"

  - name: report_receipt_hit
    type: shell_exec
    when: "receipt.reusable"
    params:
      command: |
        echo "Skipping claim extraction for {{ claim_issue }}: {{ receipt.reason }}"

  - name: record_receipt_hit
    type: observatory_api
    when: "receipt.reusable"
    params:
      path: /api/v2/claims/stage-receipts
      method: POST
      body:
        stage: extract-claims
        scope_key: "{{ claim_issue }}"
        input_digest: "{{ receipt.input_digest }}"
        skill_fqn: "{{ receipt.implementation.skill_fqn }}"
        skill_revision: "{{ receipt.implementation.skill_revision }}"
        model: "{{ receipt.implementation.model }}"
        harness: "{{ receipt.implementation.harness }}"
        configuration_digest: "{{ receipt.implementation.configuration_digest }}"
        status: hit
        agent_job_avoided: true
        details:
          reason: "{{ receipt.reason }}"
          repository_revision: "{{ claims_repository_revision }}"

  - name: prepare_claim_output
    type: shell_exec
    when: "not receipt.reusable"
    params:
      command: |
        mkdir -p /app/artifacts/claims
        chmod 0777 /app/artifacts/claims
        ISSUE="{{ claim_issue }}" python3 - <<'PY'
        import os
        from pathlib import Path

        issue = os.environ['ISSUE'].upper()
        root = Path('/app/artifacts/claims')
        removed = []
        for path in root.rglob('*'):
            if not path.is_file() or '.receipts' in path.parts:
                continue
            if (issue in path.as_posix().upper() or
                    issue in path.read_text(errors='ignore').upper()):
                path.unlink()
                removed.append(path.relative_to(root).as_posix())
        print(f'removed {len(removed)} stale claim outputs for {issue}')
        PY

  - name: extract
    when: "not receipt.reusable"
    for_each: receipt.input_artifacts
    as: artifact
    concurrency: 3
    workflow: run-skill
    vars:
      skill_fqn: "{{ claims_skill_execution_repo }}:extract-claims"
      skill_issue: "{{ claim_issue }}"
      skill_model: "{{ claims_model }}"
      skill_harness: "{{ claims_harness }}"
      skill_extra_env: "{{ claims_git_extra_env }}"
      skill_extra_kwargs: "artifact_filter={{ artifact }} extractor_revision={{ claims_skill_revision }} repository_revision={{ claims_repository_revision }} model={{ claims_model }} harness={{ claims_harness }} configuration_digest={{ claims_configuration_digest }} decontextualization_mode={{ claims_decontextualization_mode }} segmentation_version={{ claims_segmentation_version }} preceding_context_units={{ claims_preceding_context_units }} following_context_units={{ claims_following_context_units }} force=true"

  - name: record_receipt_miss
    type: observatory_api
    when: "not receipt.reusable"
    params:
      path: /api/v2/claims/stage-receipts
      method: POST
      body:
        stage: extract-claims
        scope_key: "{{ claim_issue }}"
        input_digest: "{{ receipt.input_digest }}"
        skill_fqn: "{{ receipt.implementation.skill_fqn }}"
        skill_revision: "{{ receipt.implementation.skill_revision }}"
        model: "{{ receipt.implementation.model }}"
        harness: "{{ receipt.implementation.harness }}"
        configuration_digest: "{{ receipt.implementation.configuration_digest }}"
        status: miss
        agent_job_avoided: false
        details:
          reason: "{{ receipt.reason }}"
          repository_revision: "{{ claims_repository_revision }}"

  - name: write_receipt
    type: shell_exec
    when: "not receipt.reusable"
    params:
      command: |
        ISSUE="{{ claim_issue }}" \
        SKILL_FQN="{{ claims_skill_repo }}:extract-claims" \
        SKILL_REVISION="{{ claims_skill_revision }}" \
        REPOSITORY_REVISION="{{ claims_repository_revision }}" \
        MODEL="{{ claims_model }}" \
        HARNESS="{{ claims_harness }}" \
        CONFIGURATION_DIGEST="{{ claims_configuration_digest }}" \
        DECONTEXTUALIZATION_MODE="{{ claims_decontextualization_mode }}" \
        SEGMENTATION_VERSION="{{ claims_segmentation_version }}" \
        PRECEDING_CONTEXT_UNITS="{{ claims_preceding_context_units }}" \
        FOLLOWING_CONTEXT_UNITS="{{ claims_following_context_units }}" \
        EXPECTED_DIGEST="{{ receipt.input_digest }}" \
        python3 - <<'PY'
        import hashlib, json, os, tempfile
        from datetime import datetime, timezone
        from pathlib import Path

        root = Path('/app/artifacts')
        issue = os.environ['ISSUE'].upper()
        skill_fqn = os.environ['SKILL_FQN']
        skill_revision = os.environ['SKILL_REVISION']
        model = os.environ['MODEL']
        harness = os.environ['HARNESS']
        configuration_digest = os.environ['CONFIGURATION_DIGEST']
        decontextualization_mode = os.environ['DECONTEXTUALIZATION_MODE']
        segmentation_version = os.environ['SEGMENTATION_VERSION']
        preceding_context_units = int(os.environ['PRECEDING_CONTEXT_UNITS'])
        following_context_units = int(os.environ['FOLLOWING_CONTEXT_UNITS'])
        repository_revision = os.environ['REPOSITORY_REVISION']
        skip_dirs = {'.git', 'claims', 'verification', 'explanations'}

        def included(path):
            rel = path.relative_to(root)
            if issue not in rel.as_posix().upper():
                return False
            if any(p.startswith('.') or p in skip_dirs for p in rel.parts):
                return False
            if ({'rfe-originals', 'strat-originals', 'ci-jobs'}
                    & set(rel.parts)):
                return False
            return '-strat-text.md' not in path.name and path.name not in {
                'README.md', 'strat-rubric.md'}

        inputs = sorted(p for p in root.rglob('*.md') if p.is_file() and included(p))
        substantive_sources = {
            p.relative_to(root).as_posix(): p
            for p in inputs
            if len(p.read_text(encoding='utf-8')) >= 100
        }
        digest = hashlib.sha256()
        implementation = {
            'skill_fqn': skill_fqn,
            'skill_revision': skill_revision,
            'model': model,
            'harness': harness,
            'configuration_digest': configuration_digest,
            'decontextualization_mode': decontextualization_mode,
        }
        digest.update(b'claim-receipt-v2\0')
        digest.update(json.dumps(implementation, sort_keys=True).encode())
        digest.update(b'\0')
        for path in inputs:
            digest.update(path.relative_to(root).as_posix().encode())
            digest.update(b'\0')
            digest.update(hashlib.sha256(path.read_bytes()).digest())
        input_digest = f'sha256:{digest.hexdigest()}'
        if input_digest != os.environ['EXPECTED_DIGEST']:
            raise SystemExit(
                'source artifacts changed during extraction; refusing stale receipt')

        claim_files = []
        staged_files = []
        claim_count = 0
        source_unit_digests = []
        selection_counts = {}
        ambiguity_counts = {}
        evaluator_revisions = set()
        observatory_run_ids = []
        claims_root = root / 'claims'
        for source_file, source_path in substantive_sources.items():
            legacy_path = claims_root / f'{source_file}.claims.json'
            staged_path = claims_root / f'{source_file}.extraction.json'
            missing = [
                path.relative_to(root).as_posix()
                for path in (legacy_path, staged_path) if not path.is_file()
            ]
            if missing:
                raise SystemExit(
                    f'extraction did not produce required outputs for {source_file}: '
                    + ', '.join(missing))
            try:
                legacy = json.loads(legacy_path.read_text())
                data = json.loads(staged_path.read_text())
            except (OSError, json.JSONDecodeError) as exc:
                raise SystemExit(
                    f'extraction output for {source_file} is not valid JSON: {exc}')

            required_provenance = {
                'source_file': source_file,
                'artifact_digest': 'sha256:' + hashlib.sha256(
                    source_path.read_bytes()).hexdigest(),
                'extractor_revision': skill_revision,
                'repository_revision': repository_revision,
                'model': model,
                'harness': harness,
                'configuration_digest': configuration_digest,
                'decontextualization_mode': decontextualization_mode,
                'segmentation_version': segmentation_version,
                'preceding_context_units': preceding_context_units,
                'following_context_units': following_context_units,
                'pipeline_slug': source_file.split('/', 1)[0],
            }
            mismatches = {
                key: {'expected': expected, 'actual': data.get(key)}
                for key, expected in required_provenance.items()
                if data.get(key) != expected
            }
            if mismatches:
                raise SystemExit(
                    f'extraction provenance mismatch for {source_file}: '
                    + json.dumps(mismatches, sort_keys=True))
            if '__REQUIRED__' in json.dumps(data, sort_keys=True):
                raise SystemExit(
                    f'extraction left required judgments empty for {source_file}')
            if not isinstance(data.get('units'), list):
                raise SystemExit(
                    f'extraction units are not canonical for {source_file}')
            for field in ('run_key', 'artifact_type',
                          'segmentation_configuration_digest'):
                if not isinstance(data.get(field), str) or not data[field]:
                    raise SystemExit(
                        f'extraction is missing {field} for {source_file}')
            if not isinstance(data.get('configuration'), dict):
                raise SystemExit(
                    f'extraction is missing segmentation configuration for '
                    f'{source_file}')

            projected = []
            for unit_index, unit in enumerate(data['units']):
                if not isinstance(unit, dict) or not isinstance(
                        unit.get('source_unit'), dict):
                    raise SystemExit(
                        f'extraction unit {unit_index} is malformed for {source_file}')
                if unit.get('selection', {}).get('classification') not in {
                        'verifiable', 'mixed', 'unverifiable'}:
                    raise SystemExit(
                        f'extraction unit {unit_index} has no selection for {source_file}')
                ambiguity = unit.get('ambiguity')
                classification = unit['selection']['classification']
                if ambiguity is not None and ambiguity.get('status') not in {
                        'none', 'resolved', 'unresolved'}:
                    raise SystemExit(
                        f'extraction unit {unit_index} has no ambiguity result '
                        f'for {source_file}')
                if classification == 'unverifiable' and (
                        ambiguity is not None or unit.get('claims')):
                    raise SystemExit(
                        f'unverifiable unit {unit_index} emitted judgments or '
                        f'claims for {source_file}')
                if classification != 'unverifiable' and ambiguity is None:
                    raise SystemExit(
                        f'selected unit {unit_index} has no ambiguity result '
                        f'for {source_file}')
                if ambiguity and ambiguity.get('status') == 'unresolved' and \
                        unit.get('claims'):
                    raise SystemExit(
                        f'unresolved unit {unit_index} emitted claims for '
                        f'{source_file}')
                for claim in unit.get('claims', []):
                    evaluation = claim.get('evaluation') or {}
                    if not isinstance(evaluation.get('entailed'), bool):
                        raise SystemExit(
                            f'extraction claim lacks entailment for {source_file}')
                    elements = evaluation.get('coverage_elements')
                    if not isinstance(elements, list) or not elements:
                        raise SystemExit(
                            f'extraction claim lacks coverage elements for '
                            f'{source_file}')
                    coverage_problem = any(
                        (element.get('element_kind') == 'verifiable' and
                         element.get('coverage') == 'omitted') or
                        (element.get('element_kind') == 'unverifiable' and
                         element.get('coverage') == 'included')
                        for element in elements
                    )
                    result = evaluation.get('coverage_result')
                    if (coverage_problem and result == 'complete') or (
                            not coverage_problem and result != 'complete'):
                        raise SystemExit(
                            f'extraction claim has inconsistent coverage for '
                            f'{source_file}')
                    if claim.get('accepted', True):
                        projected.append({
                            'claim': claim.get('claim_text'),
                            'type': claim.get('claim_type'),
                            'original_text': claim.get('original_text'),
                        })

            expected_legacy = {
                'source_file': source_file,
                'pipeline_slug': data.get('pipeline_slug'),
                'claim_count': len(projected),
                'claims': projected,
            }
            if legacy != expected_legacy:
                raise SystemExit(
                    f'legacy projection does not match canonical extraction for '
                    f'{source_file}')

            claim_files.append(legacy_path)
            staged_files.append(staged_path)
            claim_count += len(projected)
            if data.get('observatory_run_id') is not None:
                observatory_run_ids.append(data['observatory_run_id'])
            for unit in data['units']:
                source = unit.get('source_unit', {})
                source_unit_digests.append(source.get('digest') or source.get('id') or source.get('unit_key'))
                selection = unit.get('selection', {})
                classification = selection.get('classification', 'missing')
                selection_counts[classification] = selection_counts.get(classification, 0) + 1
                ambiguity = unit.get('ambiguity') or {}
                status = ambiguity.get('status', 'not_applicable')
                ambiguity_counts[status] = ambiguity_counts.get(status, 0) + 1
                for result in (selection, ambiguity):
                    if result.get('evaluator_revision'):
                        evaluator_revisions.add(result['evaluator_revision'])
                for claim in unit.get('claims', []):
                    evaluation = claim.get('evaluation') or {}
                    if evaluation.get('evaluator_revision'):
                        evaluator_revisions.add(evaluation['evaluator_revision'])

        receipt = {
            'schema_version': 2,
            'stage': 'extract-claims',
            'scope': {'issue': issue},
            'implementation': implementation,
            'provenance': {'repository_revision': repository_revision},
            'inputs': {
                'digest': input_digest,
                'artifacts': [p.relative_to(root).as_posix() for p in inputs],
            },
            'outputs': {
                'claim_count': claim_count,
                'source_unit_count': len(source_unit_digests),
                'source_unit_digests': sorted(value for value in source_unit_digests if value),
                'selection_counts': selection_counts,
                'ambiguity_counts': ambiguity_counts,
                'evaluator_revisions': sorted(evaluator_revisions),
                'observatory_run_ids': sorted(observatory_run_ids),
                'artifacts': [p.relative_to(root).as_posix()
                              for p in claim_files + staged_files],
            },
            'result': 'complete',
            'completed_at': datetime.now(timezone.utc).isoformat(),
        }

        receipt_path = claims_root / '.receipts' / f'{issue}.json'
        receipt_path.parent.mkdir(parents=True, exist_ok=True)
        fd, temporary = tempfile.mkstemp(prefix=f'.{receipt_path.name}.',
                                         dir=receipt_path.parent)
        try:
            with os.fdopen(fd, 'w') as stream:
                json.dump(receipt, stream, indent=2, sort_keys=True)
                stream.write('\n')
            os.replace(temporary, receipt_path)
            os.chmod(receipt_path, 0o666)
            os.chmod(receipt_path.parent, 0o777)
            os.chmod(claims_root, 0o777)
        finally:
            if os.path.exists(temporary):
                os.unlink(temporary)
        print(json.dumps({'receipt_path': receipt_path.as_posix(),
                          'claim_count': claim_count, 'written': True}))
        PY
