# ====================================================================
# Run Skill: Submit + Poll
# ====================================================================
#
# Submits a skill job via the dashboard API, then polls until the
# K8s job reaches "completed" or "failed" status.
#
# Required vars:
#   skill_fqn   — fully-qualified skill name (e.g. "github.local/opendatahub-io/rfe-creator@main:rfe.speedrun")
#   skill_issue — Jira issue key (e.g. "RHAIRFE-1")

name: run-skill
description: "Submit a skill job and wait for completion"

steps:

  - name: submit
    type: agent_job
    params:
      body:
        fqn: "{{ skill_fqn }}"
        args:
          issue: "{{ skill_issue }}"
          model: opus
          runner: cli
          harness: claude-code
          strace: true
          mlflow: true
          otel: true
    register: submitted_job

  - name: wait_for_completion
    type: shell_exec
    params:
      command: |
        job_name="{{ submitted_job.body.job_name }}"
        echo "Waiting for job: $job_name"
        elapsed=0
        while [ $elapsed -lt 3600 ]; do
          status=$(curl -sf \
            "{{ dashboard_base }}/api/jobs/$job_name" 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" \
            2>/dev/null || echo "")
          case "$status" in
            completed)
              echo "Job $job_name completed successfully"
              exit 0
              ;;
            failed)
              echo "Job $job_name failed"
              exit 1
              ;;
          esac
          sleep 15
          elapsed=$((elapsed + 15))
        done
        echo "TIMEOUT: job $job_name did not complete within 3600s"
        exit 1
