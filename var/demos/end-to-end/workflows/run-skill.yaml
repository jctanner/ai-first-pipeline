# ====================================================================
# Run Skill: Submit + Wait
# ====================================================================
#
# Submits a skill job via the dashboard API, then watches the K8s job
# natively until it completes or fails, capturing pod logs.
#
# Required vars:
#   skill_fqn   — fully-qualified skill name (e.g. "github.local/opendatahub-io/rfe-creator@main:rfe.speedrun")
#   skill_issue — Jira issue key (e.g. "RHAIRFE-1")
#
# Optional vars:
#   skill_extra_kwargs — space-separated key=value pairs for prompt inputs
#   skill_extra_env    — JSON object string of env vars to inject into the pod

name: run-skill
description: "Submit a skill job and wait for completion"

vars:
  skill_extra_kwargs: ""
  skill_extra_env: "{}"

steps:

  - name: submit
    type: agent_job
    params:
      body:
        fqn: "{{ skill_fqn }}"
        args:
          issue: "{{ skill_issue }}"
          model: opus
          runner: cli
          harness: claude-code
          strace: true
          mlflow: true
          otel: true
          extra_kwargs: "{{ skill_extra_kwargs }}"
          extra_env: "{{ skill_extra_env | tojson }}"
    register: submitted_job

  - name: wait_for_completion
    type: agent_job_wait
    params:
      job_name: "{{ submitted_job.body.job_name }}"
    register: skill_result
