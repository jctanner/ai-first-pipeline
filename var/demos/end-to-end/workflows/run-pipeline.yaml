# ====================================================================
# Run Pipeline: RFE → Strategy → Epic → Code
# ====================================================================
#
# Runs the full pipeline on a seeded RFE:
#   1. rfe-speedrun    — create, review, fix, submit the RFE
#   2. Label           — add strat-creator-3.6 to mark ready for strategy
#   3. strat-create    — create a RHAISTRAT ticket from the RFE
#   4. strat-refine    — add HOW, dependencies, NFRs
#   5. strat-review    — adversarial review
#   6. epic-decompose  — decompose RHAISTRAT into epic DAG
#   7. epic-investigate — run Investigation epics
#   8. epic-codegen    — generate code for Implementation epics
#
# Requires: rfe_issue set (default RHAIRFE-1 from seed-rfe)

name: run-pipeline
description: "Run the full RFE → Strategy → Epic → Code pipeline"

steps:

  # ── Phase A: RFE Speedrun ────────────────────────────────────

  - name: rfe_speedrun
    description: "Run rfe-speedrun on {{ rfe_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/rfe-creator@main:rfe.speedrun"
      skill_issue: "{{ rfe_issue }}"

  - name: rfe_submit
    description: "Run rfe-submit on {{ rfe_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/rfe-creator@main:rfe.submit"
      skill_issue: "{{ rfe_issue }}"

  # ── Gate: RFE must have passed rubric review ─────────────────

  - name: check_rubric_pass
    type: shell_exec
    params:
      command: |
        curl -vk -u "admin:admin" \
          -o /tmp/rfe_labels.json \
          "{{ jira_base }}/rest/api/2/issue/{{ rfe_issue }}?fields=labels"
        echo "--- Response body ---"
        cat /tmp/rfe_labels.json
        echo ""
        labels=$(python3 -c "import json; print(' '.join(json.load(open('/tmp/rfe_labels.json'))['fields']['labels']))")
        echo "Labels on {{ rfe_issue }}: $labels"
        if echo "$labels" | grep -q "rfe-creator-autofix-rubric-pass"; then
          echo "GATE PASSED: rfe-creator-autofix-rubric-pass found"
          exit 0
        fi
        echo "GATE FAILED: rfe-creator-autofix-rubric-pass not found — RFE did not pass rubric review"
        exit 1

  # ── Label for strategy creation ──────────────────────────────

  - name: add_strat_label
    type: jira_api
    params:
      path: /rest/api/2/issue/{{ rfe_issue }}
      method: PUT
      body:
        update:
          labels:
            - add: "strat-creator-3.6"

  # ── Phase B: Strategy Create ─────────────────────────────────

  - name: strat_create
    description: "Run strategy-create on {{ rfe_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/strat-creator@main:strategy-create"
      skill_issue: "{{ rfe_issue }}"

  # ── Discover the created RHAISTRAT key ───────────────────────

  - name: discover_strat_key
    type: shell_exec
    params:
      command: |
        curl -vk -u "admin:admin" \
          -o /tmp/rfe_links.json \
          "{{ jira_base }}/rest/api/2/issue/{{ rfe_issue }}?fields=issuelinks"
        echo "--- Response body ---" >&2
        cat /tmp/rfe_links.json >&2
        echo "" >&2
        python3 -c "
        import json, sys
        data = json.load(open('/tmp/rfe_links.json'))
        for link in data.get('fields', {}).get('issuelinks', []):
            if link.get('type', {}).get('name') == 'Cloners':
                for d in ['inwardIssue', 'outwardIssue']:
                    issue = link.get(d, {})
                    if issue.get('key', '').startswith('RHAISTRAT'):
                        print(issue['key'])
                        sys.exit(0)
        print('ERROR: no RHAISTRAT link found on {{ rfe_issue }}', file=sys.stderr)
        sys.exit(1)
        "
    register: strat_discovery

  - name: set_strat_issue
    type: set_fact
    vars:
      strat_issue: "{{ strat_discovery.stdout | trim }}"

  # ── Phase C: Strategy Refine ─────────────────────────────────

  - name: strat_refine
    description: "Run strategy-refine on {{ strat_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/strat-creator@main:strategy-refine"
      skill_issue: "{{ strat_issue }}"

  # ── Phase D: Strategy Review ─────────────────────────────────

  - name: strat_review
    description: "Run strategy-review on {{ strat_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/strat-creator@main:strategy-review"
      skill_issue: "{{ strat_issue }}"

  # ── Phase E: Epic Decompose ─────────────────────────────────

  - name: epic_decompose
    description: "Decompose {{ strat_issue }} into epic DAG"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/epic-creator@main:epic-decompose"
      skill_issue: "{{ strat_issue }}"

  # ── Phase E.5: Epic Submit ────────────────────────────────────
  #
  # Create RHOAIENG Jira tickets from the decomposer's artifact files.
  # Updates each artifact's frontmatter with the created jira_key so
  # downstream skills can reference the real Jira ticket.

  - name: epic_submit
    description: "Create Jira tickets for {{ strat_issue }} epics"
    type: shell_exec
    params:
      command: |
        ARTIFACTS_DIR="/app/artifacts/epic-tasks"
        STRAT="{{ strat_issue }}"
        JIRA="{{ jira_base }}"

        if [ ! -d "$ARTIFACTS_DIR" ]; then
          echo "ERROR: $ARTIFACTS_DIR not found" >&2
          exit 1
        fi

        python3 -c "
        import glob, yaml, json, os, sys, ssl, urllib.request, base64

        artifacts_dir = '$ARTIFACTS_DIR'
        strat = '$STRAT'
        jira = '$JIRA'

        ctx = ssl.create_default_context()
        ctx.check_hostname = False
        ctx.verify_mode = ssl.CERT_NONE
        creds = base64.b64encode(b'admin:admin').decode()

        priority_map = {'P0': 'Highest', 'P1': 'High', 'P2': 'Medium'}
        created = []

        pattern = os.path.join(artifacts_dir, f'{strat}-E*.md')
        files = sorted(glob.glob(pattern))
        if not files:
            print(f'No epic artifacts found for {strat}', file=sys.stderr)
            sys.exit(0)

        for path in files:
            if path.endswith('-decomposition.md'):
                continue

            with open(path) as f:
                content = f.read()
            parts = content.split('---', 2)
            if len(parts) < 3:
                print(f'  SKIP: {path} has no frontmatter', file=sys.stderr)
                continue

            meta = yaml.safe_load(parts[1])
            body = parts[2].strip()
            epic_id = meta.get('epic_id', os.path.basename(path).replace('.md', ''))

            if meta.get('jira_key'):
                print(f'  SKIP: {epic_id} already submitted as {meta[\"jira_key\"]}', file=sys.stderr)
                created.append({'epic_id': epic_id, 'jira_key': meta['jira_key'],
                                'type': meta.get('type', 'unknown'), 'status': 'exists'})
                continue

            # Search Jira for existing ticket (handles create-succeeded-but-write-failed retries)
            try:
                import urllib.parse
                search_jql = urllib.parse.quote(f'project = RHOAIENG AND labels = \"epic-id:{epic_id}\"')
                search_req = urllib.request.Request(
                    f'{jira}/rest/api/2/search?jql={search_jql}&fields=key&maxResults=1',
                    headers={'Authorization': f'Basic {creds}', 'Content-Type': 'application/json'})
                search_resp = urllib.request.urlopen(search_req, context=ctx)
                search_data = json.loads(search_resp.read())
                if search_data.get('issues'):
                    found_key = search_data['issues'][0]['key']
                    print(f'  RECOVERED: {epic_id} already exists as {found_key}, updating frontmatter', file=sys.stderr)
                    meta['jira_key'] = found_key
                    meta['status'] = 'Submitted'
                    with open(path, 'w') as f:
                        f.write('---\n')
                        f.write(yaml.dump(meta, default_flow_style=False, sort_keys=False))
                        f.write('---\n')
                        f.write(body)
                        f.write('\n')
                    created.append({'epic_id': epic_id, 'jira_key': found_key,
                                    'type': meta.get('type', 'unknown'), 'status': 'recovered'})
                    continue
            except Exception as e:
                print(f'  WARNING: Jira search for {epic_id} failed: {e}', file=sys.stderr)

            # Extract title from first heading
            title = f'{epic_id}: {meta.get(\"component\", \"\")} - {meta.get(\"type\", \"\")}'
            for line in body.split('\n'):
                if line.startswith('#'):
                    title = line.lstrip('#').strip()
                    break

            payload = {
                'fields': {
                    'project': {'key': 'RHOAIENG'},
                    'issuetype': {'name': 'Epic'},
                    'parent': {'key': meta.get('parent_strat', strat)},
                    'summary': title,
                    'description': body,
                    'priority': {'name': priority_map.get(meta.get('priority', ''), 'Medium')},
                    'labels': ['epic-submit', f'epic-type-{meta.get(\"type\", \"unknown\").lower()}',
                               f'epic-id:{epic_id}'],
                }
            }
            comp = meta.get('component')
            if comp:
                payload['fields']['components'] = [{'name': comp}]

            data = json.dumps(payload).encode()
            req = urllib.request.Request(
                f'{jira}/rest/api/2/issue',
                data=data,
                headers={'Authorization': f'Basic {creds}',
                         'Content-Type': 'application/json'})
            try:
                resp = urllib.request.urlopen(req, context=ctx)
                result = json.loads(resp.read())
                jira_key = result['key']
            except Exception as e:
                print(f'  ERROR creating {epic_id}: {e}', file=sys.stderr)
                continue

            # Update artifact frontmatter with jira_key
            meta['jira_key'] = jira_key
            meta['status'] = 'Submitted'
            with open(path, 'w') as f:
                f.write('---\n')
                f.write(yaml.dump(meta, default_flow_style=False, sort_keys=False))
                f.write('---\n')
                f.write(body)
                f.write('\n')

            print(f'  CREATED: {epic_id} -> {jira_key}', file=sys.stderr)
            created.append({'epic_id': epic_id, 'jira_key': jira_key,
                            'type': meta.get('type', 'unknown'), 'status': 'created'})

        # Add label to strategy ticket
        try:
            label_data = json.dumps({'update': {'labels': [{'add': 'epic-submit-complete'}]}}).encode()
            label_req = urllib.request.Request(
                f'{jira}/rest/api/2/issue/{strat}',
                data=label_data,
                headers={'Authorization': f'Basic {creds}',
                         'Content-Type': 'application/json'},
                method='PUT')
            urllib.request.urlopen(label_req, context=ctx)
        except Exception as e:
            print(f'  WARNING: failed to label {strat}: {e}', file=sys.stderr)

        print(json.dumps(created))
        "
    register: epic_submit_result

  # ── Discover epics with Jira keys ──────────────────────────
  #
  # Re-read artifact files after epic-submit. Now each file has
  # jira_key in frontmatter. Split by type and include both
  # epic_id and jira_key for downstream skills.

  - name: discover_epics
    type: shell_exec
    params:
      command: |
        ARTIFACTS_DIR="/app/artifacts/epic-tasks"
        STRAT="{{ strat_issue }}"

        if [ ! -d "$ARTIFACTS_DIR" ]; then
          echo "ERROR: $ARTIFACTS_DIR not found" >&2
          exit 1
        fi

        python3 -c "
        import glob, yaml, json, os, sys

        artifacts_dir = '$ARTIFACTS_DIR'
        strat = '$STRAT'
        investigation = []
        implementation = []

        pattern = os.path.join(artifacts_dir, f'{strat}-E*.md')
        for path in sorted(glob.glob(pattern)):
            if path.endswith('-decomposition.md'):
                continue
            with open(path) as f:
                content = f.read()
            parts = content.split('---', 2)
            if len(parts) < 3:
                continue
            meta = yaml.safe_load(parts[1])
            epic_id = meta.get('epic_id', os.path.basename(path).replace('.md', ''))
            jira_key = meta.get('jira_key', '')
            epic_type = meta.get('type', 'unknown')
            entry = {'epic_id': epic_id, 'jira_key': jira_key}
            print(f'  Found: {epic_id} key={jira_key} type={epic_type}', file=sys.stderr)
            if epic_type == 'Investigation':
                investigation.append(entry)
            elif epic_type == 'Implementation':
                implementation.append(entry)
            else:
                print(f'  Skipping unknown type: {epic_type}', file=sys.stderr)

        print(json.dumps({'investigation': investigation, 'implementation': implementation}))
        "
    register: epic_discovery

  - name: set_epic_lists
    type: set_fact
    vars:
      epic_lists: "{{ epic_discovery.stdout | fromjson }}"

  # ── Phase F: Epic Investigate ───────────────────────────────
  #
  # Run Investigation epics to resolve unknowns that gate sibling
  # Implementation epics.

  - name: run_investigations
    description: "Run Investigation epics"
    for_each: epic_lists.investigation
    as: epic
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/epic-investigator@main:epic-investigate"
      skill_issue: "{{ epic.jira_key }}"

  # ── Phase G: Epic Codegen ───────────────────────────────────
  #
  # Generate implementation code for each Implementation epic.

  - name: run_codegen
    description: "Run codegen for Implementation epics"
    for_each: epic_lists.implementation
    as: epic
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/epic-code-gen@main:epic-codegen"
      skill_issue: "{{ epic.jira_key }}"

