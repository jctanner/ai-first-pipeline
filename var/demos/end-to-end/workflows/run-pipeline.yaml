# ====================================================================
# Run Pipeline: RFE → Strategy → Epic → Code
# ====================================================================
#
# Orchestrates the full pipeline by chaining sub-workflows:
#   1. run-rfe   — speedrun, submit, gate, label
#   2. run-strat — create, discover key, refine, review
#   3. run-epic  — decompose, submit to Jira, investigate, codegen
#
# Each sub-workflow can also be run independently:
#   markov run --workflow run-rfe   --var rfe_issue=RHAIRFE-1
#   markov run --workflow run-strat --var rfe_issue=RHAIRFE-1
#   markov run --workflow run-epic  --var strat_issue=RHAISTRAT-1
#
# Requires: rfe_issue (default RHAIRFE-1 from seed-rfe)

name: run-pipeline
description: "Run the full RFE → Strategy → Epic → Code pipeline"

steps:

  # ── Phase A: RFE ────────────────────────────────────────────

  - name: rfe
    description: "RFE speedrun, submit, and gate for {{ rfe_issue }}"
    workflow: run-rfe
    vars:
      rfe_issue: "{{ rfe_issue }}"

  # ── Phase B–D: Strategy ─────────────────────────────────────

  - name: strategy
    description: "Strategy create, refine, and review for {{ rfe_issue }}"
    workflow: run-strat
    vars:
      rfe_issue: "{{ rfe_issue }}"

  # ── Discover strat key for epic phase ───────────────────────
  #
  # run-strat sets strat_issue internally but set_fact doesn't
  # propagate back to the parent. Re-discover here.

  - name: discover_strat_key
    type: shell_exec
    params:
      command: |
        curl -vk -u "{{ jira_user }}:{{ jira_token }}" \
          -o /tmp/rfe_links.json \
          "{{ jira_base }}/rest/api/2/issue/{{ rfe_issue }}?fields=issuelinks"
        echo "--- Response body ---" >&2
        cat /tmp/rfe_links.json >&2
        echo "" >&2
        python3 -c "
        import json, sys
        data = json.load(open('/tmp/rfe_links.json'))
        for link in data.get('fields', {}).get('issuelinks', []):
            if link.get('type', {}).get('name') == 'Cloners':
                for d in ['inwardIssue', 'outwardIssue']:
                    issue = link.get(d, {})
                    if issue.get('key', '').startswith('RHAISTRAT'):
                        print(issue['key'])
                        sys.exit(0)
        print('ERROR: no RHAISTRAT link found on {{ rfe_issue }}', file=sys.stderr)
        sys.exit(1)
        "
    register: strat_discovery

  - name: set_strat_issue
    type: set_fact
    vars:
      strat_issue: "{{ strat_discovery.stdout | trim }}"

  # ── Phase E–G: Epic ─────────────────────────────────────────

  - name: epic
    description: "Epic decompose, submit, investigate, and codegen for {{ strat_issue }}"
    workflow: run-epic
    vars:
      strat_issue: "{{ strat_issue }}"
