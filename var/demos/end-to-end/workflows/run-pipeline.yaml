# ====================================================================
# Run Pipeline: RFE → Strategy → Epic → Code
# ====================================================================
#
# Runs the full pipeline on a seeded RFE:
#   1. rfe-speedrun    — create, review, fix, submit the RFE
#   2. Label           — add strat-creator-3.6 to mark ready for strategy
#   3. strat-create    — create a RHAISTRAT ticket from the RFE
#   4. strat-refine    — add HOW, dependencies, NFRs
#   5. strat-review    — adversarial review
#   6. epic-decompose  — decompose RHAISTRAT into epic DAG
#   7. epic-investigate — run Investigation epics
#   8. epic-codegen    — generate code for Implementation epics
#
# Requires: rfe_issue set (default RHAIRFE-1 from seed-rfe)

name: run-pipeline
description: "Run the full RFE → Strategy → Epic → Code pipeline"

steps:

  # ── Phase A: RFE Speedrun ────────────────────────────────────

  - name: rfe_speedrun
    description: "Run rfe-speedrun on {{ rfe_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/rfe-creator@main:rfe.speedrun"
      skill_issue: "{{ rfe_issue }}"

  - name: rfe_submit
    description: "Run rfe-submit on {{ rfe_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/rfe-creator@main:rfe.submit"
      skill_issue: "{{ rfe_issue }}"

  # ── Gate: RFE must have passed rubric review ─────────────────

  - name: check_rubric_pass
    type: shell_exec
    params:
      command: |
        curl -vk -u "admin:admin" \
          -o /tmp/rfe_labels.json \
          "{{ jira_base }}/rest/api/2/issue/{{ rfe_issue }}?fields=labels"
        echo "--- Response body ---"
        cat /tmp/rfe_labels.json
        echo ""
        labels=$(python3 -c "import json; print(' '.join(json.load(open('/tmp/rfe_labels.json'))['fields']['labels']))")
        echo "Labels on {{ rfe_issue }}: $labels"
        if echo "$labels" | grep -q "rfe-creator-autofix-rubric-pass"; then
          echo "GATE PASSED: rfe-creator-autofix-rubric-pass found"
          exit 0
        fi
        echo "GATE FAILED: rfe-creator-autofix-rubric-pass not found — RFE did not pass rubric review"
        exit 1

  # ── Label for strategy creation ──────────────────────────────

  - name: add_strat_label
    type: jira_api
    params:
      path: /rest/api/2/issue/{{ rfe_issue }}
      method: PUT
      body:
        update:
          labels:
            - add: "strat-creator-3.6"

  # ── Phase B: Strategy Create ─────────────────────────────────

  - name: strat_create
    description: "Run strategy-create on {{ rfe_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/strat-creator@main:strategy-create"
      skill_issue: "{{ rfe_issue }}"

  # ── Discover the created RHAISTRAT key ───────────────────────

  - name: discover_strat_key
    type: shell_exec
    params:
      command: |
        curl -vk -u "admin:admin" \
          -o /tmp/rfe_links.json \
          "{{ jira_base }}/rest/api/2/issue/{{ rfe_issue }}?fields=issuelinks"
        echo "--- Response body ---" >&2
        cat /tmp/rfe_links.json >&2
        echo "" >&2
        python3 -c "
        import json, sys
        data = json.load(open('/tmp/rfe_links.json'))
        for link in data.get('fields', {}).get('issuelinks', []):
            if link.get('type', {}).get('name') == 'Cloners':
                for d in ['inwardIssue', 'outwardIssue']:
                    issue = link.get(d, {})
                    if issue.get('key', '').startswith('RHAISTRAT'):
                        print(issue['key'])
                        sys.exit(0)
        print('ERROR: no RHAISTRAT link found on {{ rfe_issue }}', file=sys.stderr)
        sys.exit(1)
        "
    register: strat_discovery

  - name: set_strat_issue
    type: set_fact
    vars:
      strat_issue: "{{ strat_discovery.stdout | trim }}"

  # ── Phase C: Strategy Refine ─────────────────────────────────

  - name: strat_refine
    description: "Run strategy-refine on {{ strat_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/strat-creator@main:strategy-refine"
      skill_issue: "{{ strat_issue }}"

  # ── Phase D: Strategy Review ─────────────────────────────────

  - name: strat_review
    description: "Run strategy-review on {{ strat_issue }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/strat-creator@main:strategy-review"
      skill_issue: "{{ strat_issue }}"

  # ── Phase E: Epic Decompose ─────────────────────────────────

  - name: epic_decompose
    description: "Decompose {{ strat_issue }} into epic DAG"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/epic-creator@main:epic-decompose"
      skill_issue: "{{ strat_issue }}"

  # ── Discover created epics from artifacts ───────────────────
  #
  # epic-decompose writes per-epic markdown files to artifacts/epic-tasks/.
  # Each file has YAML frontmatter with a "type:" field (Investigation or
  # Implementation). We list them and split by type.

  - name: discover_epics
    type: shell_exec
    params:
      command: |
        ARTIFACTS_DIR="/app/artifacts/epic-tasks"
        STRAT="{{ strat_issue }}"

        if [ ! -d "$ARTIFACTS_DIR" ]; then
          echo "ERROR: $ARTIFACTS_DIR not found" >&2
          exit 1
        fi

        investigation_ids=""
        implementation_ids=""

        for f in "$ARTIFACTS_DIR"/${STRAT}-E*.md; do
          [ -f "$f" ] || continue
          epic_id=$(basename "$f" .md)
          epic_type=$(python3 -c "
        import yaml, sys
        with open('$f') as fh:
            content = fh.read()
        if content.startswith('---'):
            fm = content.split('---', 2)[1]
            meta = yaml.safe_load(fm)
            print(meta.get('type', 'unknown'))
        else:
            print('unknown')
        ")
          echo "  Found: $epic_id (type=$epic_type)" >&2
          case "$epic_type" in
            Investigation) investigation_ids="$investigation_ids $epic_id" ;;
            Implementation) implementation_ids="$implementation_ids $epic_id" ;;
            *) echo "  Skipping unknown type: $epic_type" >&2 ;;
          esac
        done

        # Output as JSON for downstream steps
        python3 -c "
        import json
        inv = '${investigation_ids}'.split()
        imp = '${implementation_ids}'.split()
        print(json.dumps({'investigation': inv, 'implementation': imp}))
        "
    register: epic_discovery

  - name: set_epic_lists
    type: set_fact
    vars:
      epic_lists: "{{ epic_discovery.stdout | trim | fromjson }}"

  # ── Phase F: Epic Investigate ───────────────────────────────
  #
  # Run Investigation epics to resolve unknowns that gate sibling
  # Implementation epics. Each investigation uses --from-file to
  # read from the shared artifacts directory.

  - name: run_investigations
    description: "Run Investigation epics"
    for_each: "{{ epic_lists.investigation }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/epic-investigator@main:epic-investigate"
      skill_issue: "{{ item }}"

  # ── Phase G: Epic Codegen ───────────────────────────────────
  #
  # Generate implementation code for each Implementation epic.

  - name: run_codegen
    description: "Run codegen for Implementation epics"
    for_each: "{{ epic_lists.implementation }}"
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/epic-code-gen@main:epic-codegen"
      skill_issue: "{{ item }}"

