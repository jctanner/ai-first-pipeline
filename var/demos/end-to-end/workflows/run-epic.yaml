# ====================================================================
# Run Epic: decompose → submit → investigate → codegen
# ====================================================================
#
# Orchestrates the full epic phase by calling the three sub-workflows
# in sequence. Each sub-workflow can also be run independently:
#
#   --workflow run-epic-decompose   (decompose + submit + discover)
#   --workflow run-epic-investigate (discover + fan-out investigations)
#   --workflow run-epic-codegen     (discover + fan-out codegen)
#
# Requires: strat_issue (e.g. RHAISTRAT-1)

name: run-epic
description: "Run epic decompose, submit, investigate, and codegen for {{ strat_issue }}"

steps:

  - name: decompose
    description: "Decompose {{ strat_issue }}, submit to Jira, discover epics"
    workflow: run-epic-decompose

  - name: investigate
    description: "Run Investigation epics for {{ strat_issue }}"
    workflow: run-epic-investigate

  - name: codegen
    description: "Run codegen for Implementation epics of {{ strat_issue }}"
    workflow: run-epic-codegen
