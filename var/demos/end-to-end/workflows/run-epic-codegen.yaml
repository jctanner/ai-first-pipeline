# ====================================================================
# Run Epic Codegen
# ====================================================================
#
# Discovers Implementation epics for a strategy and fans out the
# epic-code-gen skill for each one.
#
# Requires: strat_issue (e.g. RHAISTRAT-1)
# Prerequisite: run-epic-decompose must have completed first.

name: run-epic-codegen
description: "Run codegen for Implementation epics of {{ strat_issue }}"

steps:

  # Discover epics by querying Jira for children of the strategy.
  # Codegen is self-contained — it doesn't read decomposer artifacts.
  # Classification uses labels applied by submit.py:
  #   epic-creator-investigation → Investigation
  #   otherwise                  → Implementation
  - name: discover_epics
    type: shell_exec
    params:
      command: |
        python3 -c "
        import json, os, sys, ssl, urllib.request, urllib.error

        ssl._create_default_https_context = ssl._create_unverified_context

        server = '{{ jira_base }}'.rstrip('/')
        strat = '{{ strat_issue }}'
        auth = '{{ jira_user }}:{{ jira_token }}'

        import base64
        auth_header = 'Basic ' + base64.b64encode(auth.encode()).decode()

        body = json.dumps({
            'jql': f'parent = {strat}',
            'fields': ['key', 'summary', 'labels'],
            'maxResults': 100,
        }).encode()

        req = urllib.request.Request(
            f'{server}/rest/api/2/search',
            data=body,
            headers={
                'Content-Type': 'application/json',
                'Authorization': auth_header,
            },
        )
        resp = urllib.request.urlopen(req)
        data = json.loads(resp.read())

        investigation = []
        implementation = []

        for issue in data.get('issues', []):
            key = issue['key']
            fields = issue.get('fields', {})
            title = fields.get('summary', key)
            labels = fields.get('labels', [])

            entry = {'jira_key': key, 'title': title}
            print(f'  Found: {key} — {title}', file=sys.stderr)

            if 'epic-creator-investigation' in labels:
                investigation.append(entry)
                print(f'    → Investigation', file=sys.stderr)
            else:
                implementation.append(entry)
                print(f'    → Implementation', file=sys.stderr)

        print(f'  Total: {len(investigation)} investigation, {len(implementation)} implementation', file=sys.stderr)
        print(json.dumps({'investigation': investigation, 'implementation': implementation}))
        "
    register: epic_discovery

  - name: set_epic_lists
    type: set_fact
    vars:
      epic_lists: "{{ epic_discovery.stdout | fromjson }}"

  # Create codegen-format epic-task files by running fetch_jira_epics.py
  # from the epic-code-gen repo. This replicates what run_pipeline.py does
  # in production before invoking /epic-codegen.
  - name: prepare_artifacts
    description: "Create codegen-format epic-task files from Jira"
    type: shell_exec
    params:
      command: |
        REPO_DIR="/tmp/epic-code-gen-prepare"
        CLONE_HOST="github-emulator.ai-pipeline.svc.cluster.local"

        if [ ! -d "$REPO_DIR" ]; then
          GIT_SSL_NO_VERIFY=1 git clone --depth 1 \
            "https://${CLONE_HOST}/{{ org }}/epic-code-gen.git" "$REPO_DIR"
        fi

        export JIRA_SERVER="{{ jira_base }}"
        export JIRA_USER="{{ jira_user }}"
        export JIRA_TOKEN="{{ jira_token }}"

        cd "$REPO_DIR"
        python3 -c "
        import ssl
        ssl._create_default_https_context = ssl._create_unverified_context

        import sys
        sys.path.insert(0, 'scripts')

        # jira_utils creates a module-level ssl_ctx that verifies certs;
        # patch it to skip verification for the local Jira emulator.
        import jira_utils
        jira_utils.ssl_ctx = ssl.create_default_context()
        jira_utils.ssl_ctx.check_hostname = False
        jira_utils.ssl_ctx.verify_mode = ssl.CERT_NONE

        sys.argv = [
            'fetch_jira_epics.py', '{{ strat_issue }}',
            '--output-dir', '/app/artifacts/epic-tasks',
            '--strategies-dir', '/app/artifacts/strategies',
            '--no-report',
        ]
        from fetch_jira_epics import main
        main()
        "

  - name: run_codegen
    description: "Run codegen for Implementation epics"
    for_each: epic_lists.implementation
    as: epic
    workflow: run-skill
    vars:
      skill_fqn: "github.local/{{ org }}/epic-code-gen@main:epic-codegen"
      skill_issue: "{{ epic.jira_key }}"
      skill_extra_kwargs: "fork_owner={{ fork_owner }}"
      skill_extra_env:
        EPIC_CODEGEN_GITHUB_TOKEN: "{{ github_api_token }}"
