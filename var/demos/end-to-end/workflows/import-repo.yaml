name: import-repo
description: "Delete and re-import a single repo from upstream"

steps:

  - name: delete_repo
    description: "Delete with bounded retries for transient emulator write locks"
    type: shell_exec
    params:
      command: |
        set -euo pipefail
        body=$(mktemp)
        trap 'rm -f "$body"' EXIT
        for attempt in $(seq 1 10); do
          status=$(curl -skS -o "$body" -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: token {{ github_api_token }}" \
            -H "Accept: application/json" \
            "{{ github_base }}/api/v3/repos/{{ org }}/{{ repo_name }}")
          case "$status" in
            204|404)
              echo "Repository delete settled with HTTP $status"
              exit 0
              ;;
            500|503)
              echo "Transient HTTP $status deleting repository (attempt $attempt/10)" >&2
              sleep 2
              ;;
            *)
              echo "Repository delete failed with HTTP $status" >&2
              cat "$body" >&2
              exit 1
              ;;
          esac
        done
        echo "Repository delete remained locked after 10 attempts" >&2
        cat "$body" >&2
        exit 1

  - name: start_import
    description: "Create the import job with bounded retries for transient write locks"
    type: shell_exec
    params:
      command: |
        set -euo pipefail
        body=$(mktemp)
        trap 'rm -f "$body"' EXIT
        for attempt in $(seq 1 10); do
          status=$(curl -skS -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            "{{ github_base }}/api/v3/admin/repos/import" \
            -d '{"url":"{{ upstream }}","owner":"{{ org }}"}')
          case "$status" in
            202)
              python3 -c \
                'import json,sys; print(json.load(open(sys.argv[1]))["job_id"])' \
                "$body"
              exit 0
              ;;
            500|503)
              echo "Transient HTTP $status creating import (attempt $attempt/10)" >&2
              sleep 2
              ;;
            *)
              echo "Repository import creation failed with HTTP $status" >&2
              cat "$body" >&2
              exit 1
              ;;
          esac
        done
        echo "Repository import creation remained locked after 10 attempts" >&2
        cat "$body" >&2
        exit 1
    register: import_result

  - name: poll_import
    type: shell_exec
    params:
      command: |
        job_id="{{ import_result.stdout | trim }}"
        if [ -z "$job_id" ]; then
          echo "FAILED: no job_id in import response"
          exit 1
        fi
        echo "Import job: $job_id"
        elapsed=0
        while [ $elapsed -lt 300 ]; do
          status=$(curl -sfk "{{ github_base }}/api/v3/admin/repos/import/$job_id" 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
          case "$status" in
            completed)
              echo "Imported successfully"
              exit 0
              ;;
            failed)
              echo "FAILED"
              exit 1
              ;;
          esac
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "TIMEOUT: import did not complete within 300s"
        exit 1

  - name: settle_import_writes
    description: "Let the completed import release its final SQLite write lock"
    type: shell_exec
    params:
      command: sleep 2
