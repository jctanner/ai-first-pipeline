# ====================================================================
# Reset GitHub Repos
# ====================================================================
#
# Bootstraps an admin API token, ensures the opendatahub-io org exists,
# creates the skills repo (no upstream), then deletes and re-imports
# every repo listed in the repos variable.

name: reset-github
description: "Delete and re-import all repos on github.local"

steps:

  # Step 1: Bootstrap an admin API token (unauthenticated admin endpoint)
  - name: bootstrap_token
    type: github_admin_api
    params:
      path: /tokens
      method: POST
      body:
        login: admin
        name: demo-reset
    register: token_result

  - name: set_auth
    type: set_fact
    vars:
      github_api_token: "{{ token_result.body.token }}"

  # Step 2: Ensure the org exists
  - name: ensure_org
    type: github_api
    params:
      path: /orgs
      method: POST
      body:
        login: "{{ org }}"
      ignore_status: [422, 409]

  # Step 3: Create local-only repos (no upstream — created empty)
  - name: delete_skills
    type: github_api
    params:
      path: /repos/{{ org }}/skills
      method: DELETE
      ignore_status: [404]

  - name: create_skills
    type: github_api
    params:
      path: /orgs/{{ org }}/repos
      method: POST
      body:
        name: skills
        auto_init: true
        description: "Claim analysis and remediation skills"

  - name: delete_eval_datasets
    type: github_api
    params:
      path: /repos/{{ org }}/eval-datasets
      method: DELETE
      ignore_status: [404]

  - name: create_eval_datasets
    type: github_api
    params:
      path: /orgs/{{ org }}/repos
      method: POST
      body:
        name: eval-datasets
        auto_init: true
        description: "Evaluation datasets for agent-eval-harness"

  - name: seed_claim_assurance_dataset
    description: "Publish the executable claim-assurance corpus and current extraction skill"
    type: shell_exec
    params:
      command: |
        set -euo pipefail
        rm -rf /tmp/claim-eval-source /tmp/claim-eval-target
        git clone --depth 1 --branch main \
          https://github.com/jctanner/ai-first-pipeline /tmp/claim-eval-source
        git clone \
          "https://x-access-token:{{ github_api_token }}@github-emulator.ai-pipeline.svc.cluster.local/{{ org }}/eval-datasets.git" \
          /tmp/claim-eval-target
        cp -a /tmp/claim-eval-source/var/demos/end-to-end/eval-datasets/claim-assurance \
          /tmp/claim-eval-target/claim-assurance
        mkdir -p /tmp/claim-eval-target/.claude/skills
        cp -a /tmp/claim-eval-source/.claude/skills/extract-claims \
          /tmp/claim-eval-target/.claude/skills/extract-claims
        cd /tmp/claim-eval-target
        git config user.name "AI Pipeline Demo"
        git config user.email "demo@ai-pipeline.local"
        git add claim-assurance .claude/skills/extract-claims
        git commit -m "Seed claim assurance evaluation corpus"
        git push origin main

  # Step 4: Delete and re-import each repo from upstream
  - name: process_repos
    for_each: repos
    for_each_key: "name"
    for_each_sort: "name"
    as: repo
    concurrency: 3
    workflow: import-repo
    vars:
      repo_name: "{{ repo.name }}"
      upstream: "{{ repo.upstream }}"

  # ── Per-repo sub-workflow ──────────────────────────────────────
