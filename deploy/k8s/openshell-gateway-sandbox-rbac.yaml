# The OpenShell chart binds this Role to its sandbox ServiceAccount. The
# gateway also creates sandbox resources, so it needs the same Role in the
# pipeline namespace where the sandbox pods mount the pipeline PVCs.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-gateway-sandbox
  namespace: ai-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshell-sandbox
subjects:
  - kind: ServiceAccount
    name: openshell
    namespace: openshell-system
